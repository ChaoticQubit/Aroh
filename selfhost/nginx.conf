events {}

http {
  server {
    listen 80;
    client_max_body_size 30m;

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
    }

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
    }

    location /realtime/v1/ {
      proxy_pass http://realtime:4000/socket/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host realtime-dev.localhost;
      proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
      proxy_pass http://storage:5000/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }

    location /engine/ {
      resolver 127.0.0.11 valid=10s;
      set $engine engine:8080;
      rewrite ^/engine/(.*)$ /$1 break;
      proxy_pass http://$engine;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
  }
}
