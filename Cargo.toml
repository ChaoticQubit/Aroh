[workspace]
resolver = "2"
members = ["crates/*", "apps/aroh/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
aroh-core = { path = "crates/aroh-core" }
aroh-domain = { path = "crates/aroh-domain" }
aroh-store = { path = "crates/aroh-store" }
aroh-reminders = { path = "crates/aroh-reminders" }
aroh-app = { path = "crates/aroh-app" }
aroh-sync = { path = "crates/aroh-sync" }
aroh-location = { path = "crates/aroh-location" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
