name = "new-goal"
start = "intake"
max_steps = 200

[state]
goal = "{id: string, title: string, context: string?, deadline: string?, timezone: string, today: string}"
calendar = "list<{title: string, start: string, minutes: int}>"
intake = "{questions: list<{id: string, text: string, kind: enum(text, number, choice), choices: list<string>}>}"
answers = "list<{id: string, answer: string}>"
research = "{summary: string, sources: list<{title: string, url: string}>}"
plan = "{summary: string, timezone: string, items: list<{title: string, start: string, minutes: int, rrule: string?, notes: string?}>, trackers: list<{name: string, fields: list<{key: string, label: string, kind: enum(number, text, bool), unit: string?}>, cadence: {freq: enum(daily, weekly), weekdays: list<string>, at: string}?}>}"
approved = "bool"
change = "string"
written = "{actions: int, series: int, occurrences: int, trackers: int}"

[[nodes]]
id = "intake"
kind = "agent"
persona = "intake-interviewer"
prompt = "Ask the owner what you need to know to plan this goal."
reads = ["goal"]
writes = "intake"

[[nodes]]
id = "questions"
kind = "human"
ask = "question"
prompt = "Answer these so the plan fits you."
reads = ["intake"]
writes = "answers"

[[nodes]]
id = "research"
kind = "agent"
persona = "goal-researcher"
prompt = "Research how to reach this goal safely, given the owner's answers."
reads = ["goal", "answers"]
writes = "research"

[[nodes]]
id = "plan"
kind = "agent"
persona = "goal-planner"
prompt = "Write the plan for this goal."
reads = ["goal", "answers", "research", "calendar"]
writes = "plan"

[[nodes]]
id = "approve"
kind = "human"
ask = "approval"
prompt = "Approve this plan?"
reads = ["plan"]
writes = "approved"

[[nodes]]
id = "approved_gate"
kind = "router"
condition = "flag(approved)"

[[nodes]]
id = "change"
kind = "human"
ask = "question"
prompt = "What should change in the plan?"
reads = ["plan"]
writes = "change"

[[nodes]]
id = "revise"
kind = "agent"
persona = "goal-planner"
prompt = "Revise the plan using the change the owner asked for."
reads = ["goal", "answers", "research", "calendar", "plan", "change"]
writes = "plan"

[[nodes]]
id = "write"
kind = "tool"
tool = "write_plan"
reads = ["plan"]
writes = "written"

[[nodes]]
id = "done"
kind = "end"

[[edges]]
from = "intake"
to = "questions"

[[edges]]
from = "questions"
to = "research"

[[edges]]
from = "research"
to = "plan"

[[edges]]
from = "plan"
to = "approve"

[[edges]]
from = "approve"
to = "approved_gate"

[[edges]]
from = "approved_gate"
to = "write"
when = "true"

[[edges]]
from = "approved_gate"
to = "change"
when = "false"

[[edges]]
from = "change"
to = "revise"

[[edges]]
from = "revise"
to = "approve"

[[edges]]
from = "write"
to = "done"
