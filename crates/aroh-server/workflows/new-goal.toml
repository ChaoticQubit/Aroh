name = "new-goal"
start = "research"
max_steps = 200

[state]
goal = "{id: string, title: string, context: string?, deadline: string?, timezone: string, today: string}"
calendar = "list<{title: string, start: string, minutes: int}>"
busy = "list<{title: string, start: string, minutes: int}>"
away_days = "list<string>"
places = "list<{name: string, goals: list<string>, routines: list<string>}>"
intake = "{questions: list<{id: string, text: string, kind: enum(text, number, choice), choices: list<string>, unit: string?, min: number?, max: number?}>}"
answers = "list<{id: string, answer: string?}>"
research = "{summary: string, sources: list<{title: string, url: string}>}"
plan = "{summary: string, timezone: string, items: list<{title: string, start: string, minutes: int, rrule: string?, notes: string?}>, trackers: list<{name: string, fields: list<{key: string, label: string, kind: enum(number, text, bool), unit: string?}>, cadence: {freq: enum(daily, weekly), weekdays: list<string>, at: string}?, rules: list<{field: string, op: enum(above, below, flat, missed), value: number, window_days: int}>?}>}"
approved = "bool"
change = "string"
profile = "list<string>"
written = "{actions: int, series: int, occurrences: int, trackers: int}"
plugin_guide = "{template: string, reference: string}"
plugin_draft = "{bundle_toml: string}"
plugin = "{id: string, name: string, version: int}"

[[nodes]]
id = "intake"
kind = "agent"
persona = "intake-interviewer"
prompt = "Ask the owner, in terms they know, what the plan needs and the research could not find."
reads = ["goal", "research"]
writes = "intake"

[[nodes]]
id = "questions"
kind = "human"
ask = "question"
prompt = "Answer these so the plan fits you."
reads = ["intake"]
writes = "answers"

[[nodes]]
id = "research"
kind = "agent"
persona = "goal-researcher"
prompt = "Research how to reach this goal safely, and name what you could not find."
reads = ["goal"]
writes = "research"

[[nodes]]
id = "plan"
kind = "agent"
persona = "goal-planner"
prompt = "Write the plan for this goal. An answer of null means the owner skipped that question: use a sensible default for it and name the defaults you chose in the summary."
reads = ["goal", "intake", "answers", "research", "calendar", "busy", "away_days", "profile", "places"]
writes = "plan"

[[nodes]]
id = "approve"
kind = "human"
ask = "approval"
prompt = "Approve this plan?"
reads = ["plan"]
writes = "approved"

[[nodes]]
id = "approved_gate"
kind = "router"
condition = "flag(approved)"

[[nodes]]
id = "change"
kind = "human"
ask = "question"
prompt = "What should change in the plan?"
reads = ["plan"]
writes = "change"

[[nodes]]
id = "revise"
kind = "agent"
persona = "goal-planner"
prompt = "Revise the plan using the change the owner asked for. An answer of null means the owner skipped that question: keep a sensible default for it."
reads = ["goal", "intake", "answers", "research", "calendar", "busy", "away_days", "profile", "places", "plan", "change"]
writes = "plan"

[[nodes]]
id = "write"
kind = "tool"
tool = "write_plan"
reads = ["plan"]
writes = "written"

[[nodes]]
id = "build_plugin"
kind = "agent"
persona = "plugin-builder"
prompt = "Build the dashboard plugin for this goal from the approved plan."
reads = ["goal", "plan", "plugin_guide"]
writes = "plugin_draft"

[[nodes]]
id = "store_plugin"
kind = "tool"
tool = "store_plugin"
reads = ["plugin_draft"]
writes = "plugin"

[[nodes]]
id = "done"
kind = "end"

[[edges]]
from = "research"
to = "intake"

[[edges]]
from = "intake"
to = "questions"

[[edges]]
from = "questions"
to = "plan"

[[edges]]
from = "plan"
to = "approve"

[[edges]]
from = "approve"
to = "approved_gate"

[[edges]]
from = "approved_gate"
to = "write"
when = "true"

[[edges]]
from = "approved_gate"
to = "change"
when = "false"

[[edges]]
from = "change"
to = "revise"

[[edges]]
from = "revise"
to = "approve"

[[edges]]
from = "write"
to = "build_plugin"

[[edges]]
from = "build_plugin"
to = "store_plugin"

[[edges]]
from = "store_plugin"
to = "done"
