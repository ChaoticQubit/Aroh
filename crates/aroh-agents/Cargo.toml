[package]
name = "aroh-agents"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rig-core = { version = "0.47.0", features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
regex = "1"
uuid = { version = "1", features = ["v7"] }
