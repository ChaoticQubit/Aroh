aroh_plugin = 1
name = "habits"
title = "Habit"
description = "A four-week check-in streak, the streak of planned habit actions, this week's ring and today's checks."

[[trackers]]
name = "Check-in"

[[trackers.fields]]
key = "done"
label = "Done today"
kind = "bool"

[[trackers.fields]]
key = "note"
label = "Note"
kind = "text"

[trackers.cadence]
freq = "daily"
at = "21:00"

[[sections]]
title = "Today"

[[sections.items]]
kind = "action_list"
label = "Today's checks"
actions = { bind = "actions", when = "today", limit = 6 }

[[sections.items]]
kind = "progress_ring"
label = "This week"

[[sections.items.rings]]
label = "Done"
unit = "count"
value = { bind = "week_done" }
target = { bind = "week_planned" }
series = 1

[[sections]]
title = "Streak"

[[sections.items]]
kind = "streak_heatmap"
label = "Check-ins, last 4 weeks"
days = { bind = "streak", tracker = "Check-in" }
series = 2

[[sections.items]]
kind = "streak_heatmap"
label = "Planned actions, last 4 weeks"
days = { bind = "streak" }
series = 3

[[sections.items]]
kind = "log_list"
label = "Notes"
entries = { bind = "entries", tracker = "Check-in" }
