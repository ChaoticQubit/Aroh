[package]
name = "aroh-vercel"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "engine"
path = "api/engine.rs"

[dependencies]
aroh-server = { path = "../aroh-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }
