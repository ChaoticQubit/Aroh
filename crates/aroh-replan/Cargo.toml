[package]
name = "aroh-replan"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
aroh-agents = { path = "../aroh-agents" }
aroh-core.workspace = true
serde_json = "1"
chrono-tz = { version = "0.10", default-features = false, features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
